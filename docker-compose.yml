services:
  postgres:
    image: postgres:16-alpine
    container_name: devonoma-postgres
    environment:
      POSTGRES_DB: devonoma
      POSTGRES_USER: devonoma
      POSTGRES_PASSWORD: devonoma
    ports:
      - "5433:5432"
    volumes:
      - devonoma-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devonoma -d devonoma"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  devonoma-postgres-data:
